# Build the firmware on every push/PR. On main it also publishes the web setup
# and update page (web/) together with the fresh firmware to GitHub Pages.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Write setup page address (shown on the device screen)
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          printf '#pragma once\n#define SETUP_PAGE_URL "%s.github.io/%s"\n' "$OWNER" "$REPO" > include/setup_url.h
          cat include/setup_url.h

      - name: Build
        run: pio run -e supermini

      - name: Merge web-flash image
        run: pio run -t merge -e supermini

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plane-radar-supermini
          if-no-files-found: error
          path: |
            .pio/build/supermini/firmware-merged.bin
            .pio/build/supermini/firmware.bin
            .pio/build/supermini/bootloader.bin
            .pio/build/supermini/partitions.bin

      - name: Assemble web site
        run: |
          VERSION=$(sed -n 's/^constexpr char kFirmwareVersion\[\] = "\([^"]*\)";.*/\1/p' include/config.h | head -n 1)
          test -n "$VERSION"
          mkdir -p site
          cp web/index.html web/tz.json web/tz-LICENSE.txt site/
          cp .pio/build/supermini/firmware.bin site/firmware.bin
          cp .pio/build/supermini/firmware-merged.bin site/firmware-merged.bin
          cp .pio/build/supermini/bootloader.bin site/bootloader.bin
          cp .pio/build/supermini/partitions.bin site/partitions.bin
          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]

          def manifest(name, parts):
              return {
                  "name": name,
                  "version": version,
                  "new_install_prompt_erase": True,
                  "builds": [{"chipFamily": "ESP32-C3", "parts": parts}],
              }

          def write(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)

          # Update: bootloader + partition table + application. The settings (NVS at 0x9000) are
          # not touched. Writing the boot parts too means the device still starts even if the
          # user ticks "erase" in the installer dialog (which only loses the settings).
          # ESP Web Tools erases the whole flash by default for firmware without Improv Serial,
          # so new_install_prompt_erase must be true to get the checkbox (left unticked).
          write("site/manifest-update.json",
                manifest("Plane Radar update", [
                    {"path": "bootloader.bin", "offset": 0},
                    {"path": "partitions.bin", "offset": 32768},
                    {"path": "firmware.bin", "offset": 65536},
                ]))
          # Full install: bootloader + partitions + app as one image at 0x0. Wipes settings.
          write("site/manifest-full.json",
                manifest("Plane Radar full install", [{"path": "firmware-merged.bin", "offset": 0}]))
          write("site/version.json", {"version": version})
          PY
          ls -l site

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Needs: repository Settings -> Pages -> Source = "GitHub Actions".
    if: github.event_name != 'pull_request'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
